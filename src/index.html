<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RustInSynth · ESP32-S3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #121316; color: #ddd; font: 13px/1.4 system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 12px;
         user-select: none; touch-action: manipulation; }
  header { display: flex; align-items: center; justify-content: space-between;
           width: 100%; max-width: 1180px; padding: 4px 6px; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #e2e8f0; }
  h1 span { color: #f97316; font-weight: 400; font-size: 12px; margin-left: 6px; }
  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #60a5fa; margin: 6px 0 6px; }
  h2:first-child { margin-top: 0; }
  #status { font-size: 12px; color: #6f6; }
  #status::before { content: "● "; }
  #status.off { color: #f66; }
  .deck { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
          width: 100%; max-width: 1180px; }
  .panel { width: min(360px, 100%); background: #1b1d22; border: 1px solid #282c34;
           border-radius: 12px; padding: 12px 14px; }
  .panel.wide { width: min(732px, 100%); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .row button, select { flex: 1; padding: 7px 6px; border: 1px solid #323640; border-radius: 7px;
                        background: #232730; color: #bbb; font-size: 12px; cursor: pointer; }
  .row button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
  select { flex: 3; color: #eee; font-size: 13px; padding: 7px 10px; }
  .cats button { padding: 5px 8px; font-size: 11px; flex: none; }
  .slider label { display: flex; justify-content: space-between; font-size: 11px;
                  color: #9aa0ac; margin-bottom: 2px; }
  .slider label span { color: #e2e8f0; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; accent-color: #3b82f6; }
  .oct { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .oct button { padding: 8px 18px; border: 1px solid #323640; border-radius: 8px;
                background: #232730; color: #ddd; font-size: 15px; cursor: pointer; }
  #octval { color: #9aa0ac; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  #keys { position: relative; height: 145px; max-width: 732px; width: 100%; }
  .key { position: absolute; top: 0; border: 1px solid #111; border-radius: 0 0 5px 5px; cursor: pointer; }
  .key.w { background: #e5e7eb; height: 100%; z-index: 1; }
  .key.w.down { background: #93c5fd; }
  .key.b { background: #141619; height: 60%; z-index: 2; border-radius: 0 0 4px 4px; }
  .key.b.down { background: #3b82f6; }
</style>
</head>
<body>
<header>
  <h1>RustInSynth <span>ESP32-S3 · PolyBLEP + TPT SVF</span></h1>
  <div id="status">ready</div>
</header>

<div class="deck">

<div class="panel wide">
  <h2>Factory Presets (85)</h2>
  <div class="row cats" id="cats"></div>
  <div class="row">
    <button id="pprev" style="flex:0 0 44px">◀</button>
    <select id="psel"></select>
    <button id="pnext" style="flex:0 0 44px">▶</button>
  </div>
</div>

<div class="panel">
  <h2>Oscillator 1</h2>
  <div class="row" id="w1">
    <button data-v="0">sine</button>
    <button data-v="1">sqr</button>
    <button data-v="2" class="active">saw</button>
    <button data-v="3">tri</button>
    <button data-v="4">noise</button>
    <button data-v="5">pulse</button>
  </div>
  <h2>Oscillator 2</h2>
  <div class="row" id="w2">
    <button data-v="0">sine</button>
    <button data-v="1">sqr</button>
    <button data-v="2" class="active">saw</button>
    <button data-v="3">tri</button>
    <button data-v="4">noise</button>
    <button data-v="5">pulse</button>
  </div>
  <div class="grid">
    <div class="slider"><label>osc 1 level <span id="v-o1l">1.00</span></label>
      <input id="p-o1l" type="range" min="0" max="1" step="0.01" value="1"></div>
    <div class="slider"><label>osc 2 level <span id="v-o2l">0.80</span></label>
      <input id="p-o2l" type="range" min="0" max="1" step="0.01" value="0.8"></div>
    <div class="slider"><label>osc 1 pw <span id="v-o1pw">0.50</span></label>
      <input id="p-o1pw" type="range" min="0.05" max="0.95" step="0.01" value="0.5"></div>
    <div class="slider"><label>osc 2 pw <span id="v-o2pw">0.50</span></label>
      <input id="p-o2pw" type="range" min="0.05" max="0.95" step="0.01" value="0.5"></div>
    <div class="slider"><label>osc 2 semi <span id="v-o2s">0</span></label>
      <input id="p-o2s" type="range" min="-24" max="24" step="1" value="0"></div>
    <div class="slider"><label>osc 2 cents <span id="v-o2c">7</span></label>
      <input id="p-o2c" type="range" min="-50" max="50" step="1" value="7"></div>
    <div class="slider"><label>osc 1 pan <span id="v-o1pn">0.00</span></label>
      <input id="p-o1pn" type="range" min="-1" max="1" step="0.02" value="0"></div>
    <div class="slider"><label>osc 2 pan <span id="v-o2pn">-0.30</span></label>
      <input id="p-o2pn" type="range" min="-1" max="1" step="0.02" value="-0.3"></div>
  </div>
</div>

<div class="panel">
  <h2>TPT SVF Filter</h2>
  <div class="row" id="fmode">
    <button data-v="0" class="active">lowpass</button>
    <button data-v="1">highpass</button>
    <button data-v="2">bandpass</button>
    <button data-v="3">notch</button>
  </div>
  <div class="grid">
    <div class="slider"><label>cutoff Hz <span id="v-cut">1800</span></label>
      <input id="p-cut" type="range" min="0" max="1" step="0.005" value="0.65"></div>
    <div class="slider"><label>resonance <span id="v-res">0.50</span></label>
      <input id="p-res" type="range" min="0" max="1" step="0.01" value="0.50"></div>
    <div class="slider"><label>env amount <span id="v-fenv">0.40</span></label>
      <input id="p-fenv" type="range" min="-1" max="1" step="0.02" value="0.40"></div>
    <div class="slider"><label>f.attack <span id="v-fatk">0.01</span></label>
      <input id="p-fatk" type="range" min="0.001" max="2" step="0.005" value="0.01"></div>
    <div class="slider"><label>f.decay <span id="v-fdec">0.35</span></label>
      <input id="p-fdec" type="range" min="0.005" max="2" step="0.01" value="0.35"></div>
    <div class="slider"><label>f.sustain <span id="v-fsus">0.25</span></label>
      <input id="p-fsus" type="range" min="0" max="1" step="0.01" value="0.25"></div>
    <div class="slider"><label>f.release <span id="v-frel">0.40</span></label>
      <input id="p-frel" type="range" min="0.005" max="3" step="0.01" value="0.40"></div>
    <div class="slider"><label>stereo width <span id="v-wth">1.00</span></label>
      <input id="p-wth" type="range" min="0" max="2" step="0.02" value="1"></div>
  </div>
</div>

<div class="panel">
  <h2>Amp Envelope & LFO</h2>
  <div class="grid">
    <div class="slider"><label>attack <span id="v-atk">0.01</span></label>
      <input id="p-atk" type="range" min="0.001" max="2.5" step="0.005" value="0.01"></div>
    <div class="slider"><label>decay <span id="v-dec">0.10</span></label>
      <input id="p-dec" type="range" min="0.005" max="2.5" step="0.01" value="0.10"></div>
    <div class="slider"><label>sustain <span id="v-sus">0.70</span></label>
      <input id="p-sus" type="range" min="0" max="1" step="0.01" value="0.70"></div>
    <div class="slider"><label>release <span id="v-rel">0.60</span></label>
      <input id="p-rel" type="range" min="0.005" max="4" step="0.01" value="0.60"></div>
    <div class="slider"><label>glide s <span id="v-prt">0.00</span></label>
      <input id="p-prt" type="range" min="0" max="1" step="0.01" value="0"></div>
    <div class="slider"><label>mod wheel <span id="v-mw">0.00</span></label>
      <input id="p-mw" type="range" min="0" max="1" step="0.01" value="0"></div>
  </div>
  <h2>LFO 1</h2>
  <div class="row" id="ldst">
    <button data-v="0">off</button>
    <button data-v="1">pitch</button>
    <button data-v="2" class="active">cutoff</button>
    <button data-v="3">amp</button>
  </div>
  <div class="row" id="lwf">
    <button data-v="0" class="active">sine</button>
    <button data-v="1">tri</button>
    <button data-v="2">sqr</button>
    <button data-v="3">saw</button>
    <button data-v="4">rnd</button>
  </div>
  <div class="grid">
    <div class="slider"><label>lfo rate Hz <span id="v-lrt">0.40</span></label>
      <input id="p-lrt" type="range" min="0.05" max="20" step="0.05" value="0.4"></div>
    <div class="slider"><label>lfo depth <span id="v-ldep">0.20</span></label>
      <input id="p-ldep" type="range" min="0" max="1" step="0.01" value="0.2"></div>
  </div>
</div>

<div class="panel">
  <h2>Stereo FX & Master</h2>
  <div class="grid">
    <div class="slider"><label>chorus rate <span id="v-ch_r">0.80</span></label>
      <input id="p-ch_r" type="range" min="0.1" max="5" step="0.05" value="0.8"></div>
    <div class="slider"><label>chorus depth <span id="v-ch_d">3.50</span></label>
      <input id="p-ch_d" type="range" min="0" max="10" step="0.1" value="3.5"></div>
    <div class="slider"><label>chorus mix <span id="v-ch_m">0.22</span></label>
      <input id="p-ch_m" type="range" min="0" max="0.8" step="0.01" value="0.22"></div>
    <div class="slider"><label>delay time s <span id="v-dl_t">0.36</span></label>
      <input id="p-dl_t" type="range" min="0.02" max="1.5" step="0.01" value="0.36"></div>
    <div class="slider"><label>delay fb <span id="v-dl_fb">0.35</span></label>
      <input id="p-dl_fb" type="range" min="0" max="0.9" step="0.01" value="0.35"></div>
    <div class="slider"><label>delay mix <span id="v-dl_m">0.20</span></label>
      <input id="p-dl_m" type="range" min="0" max="0.8" step="0.01" value="0.20"></div>
    <div class="slider"><label>reverb room <span id="v-rv_r">0.55</span></label>
      <input id="p-rv_r" type="range" min="0" max="1" step="0.01" value="0.55"></div>
    <div class="slider"><label>reverb damp <span id="v-rv_d">0.45</span></label>
      <input id="p-rv_d" type="range" min="0" max="1" step="0.01" value="0.45"></div>
    <div class="slider"><label>reverb mix <span id="v-rv_m">0.20</span></label>
      <input id="p-rv_m" type="range" min="0" max="0.8" step="0.01" value="0.20"></div>
    <div class="slider"><label>master vol <span id="v-vol">0.70</span></label>
      <input id="p-vol" type="range" min="0" max="1" step="0.01" value="0.70"></div>
  </div>
</div>

</div><!-- /.deck -->

<div class="panel wide oct">
  <button id="octdown">−</button>
  <div id="octval">octave 4 · keys Z..M / Q..I</div>
  <button id="octup">+</button>
</div>

<div id="keys"></div>

<script>
const statusEl = document.getElementById('status');
let inflight = 0, queued = null;
function cmd(q) {
  if (inflight > 2) { queued = q; return; }
  inflight++;
  fetch('/cmd?' + q).then(() => {
    statusEl.textContent = 'connected'; statusEl.className = '';
  }).catch(() => {
    statusEl.textContent = 'offline'; statusEl.className = 'off';
  }).finally(() => {
    inflight--;
    if (queued) { const n = queued; queued = null; cmd(n); }
  });
}

// Log-scale cutoff helper: slider 0..1 <-> 25..20000 Hz
const cutToHz = t => Math.round(25 * Math.pow(800, t));
const hzToCut = hz => Math.log(Math.max(25, Math.min(20000, hz)) / 25) / Math.log(800);

function bindSlider(id, key, xform) {
  const el = document.getElementById('p-' + id);
  const lb = document.getElementById('v-' + id);
  el.addEventListener('input', () => {
    const raw = parseFloat(el.value);
    const val = xform ? xform(raw) : raw;
    lb.textContent = id === 'cut' ? val : (el.step.includes('.') ? val.toFixed(2) : val);
    cmd(`k=${key}&v=${val}`);
  });
}

bindSlider('o1l', 'o1l'); bindSlider('o2l', 'o2l');
bindSlider('o1pw', 'o1pw'); bindSlider('o2pw', 'o2pw');
bindSlider('o2s', 'o2s'); bindSlider('o2c', 'o2c');
bindSlider('o1pn', 'o1pn'); bindSlider('o2pn', 'o2pn');
bindSlider('cut', 'cut', cutToHz);
bindSlider('res', 'res'); bindSlider('fenv', 'fenv');
bindSlider('fatk', 'fatk'); bindSlider('fdec', 'fdec');
bindSlider('fsus', 'fsus'); bindSlider('frel', 'frel');
bindSlider('wth', 'wth');
bindSlider('atk', 'atk'); bindSlider('dec', 'dec');
bindSlider('sus', 'sus'); bindSlider('rel', 'rel');
bindSlider('prt', 'prt'); bindSlider('mw', 'mw');
bindSlider('lrt', 'lrt'); bindSlider('ldep', 'ldep');
bindSlider('ch_r', 'ch_r'); bindSlider('ch_d', 'ch_d'); bindSlider('ch_m', 'ch_m');
bindSlider('dl_t', 'dl_t'); bindSlider('dl_fb', 'dl_fb'); bindSlider('dl_m', 'dl_m');
bindSlider('rv_r', 'rv_r'); bindSlider('rv_d', 'rv_d'); bindSlider('rv_m', 'rv_m');
bindSlider('vol', 'vol');

function bindGroup(id, key) {
  document.querySelectorAll('#' + id + ' button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      cmd(`k=${key}&v=${b.dataset.v}`);
    });
  });
}
bindGroup('w1', 'o1w'); bindGroup('w2', 'o2w');
bindGroup('fmode', 'fmode');
bindGroup('ldst', 'ldst'); bindGroup('lwf', 'lwf');

function setGroup(id, v) {
  document.querySelectorAll('#' + id + ' button').forEach(b =>
    b.classList.toggle('active', +b.dataset.v === v));
}
function setVal(id, v) {
  const el = document.getElementById('p-' + id);
  const lb = document.getElementById('v-' + id);
  if (!el || !lb) return;
  if (id === 'cut') { el.value = hzToCut(v); lb.textContent = Math.round(v); }
  else { el.value = v; lb.textContent = el.step.includes('.') ? (+v).toFixed(2) : Math.round(v); }
}

// Preset browser
let allPresets = [], curCat = 'All';
const psel = document.getElementById('psel');
const catsEl = document.getElementById('cats');

function renderPresets(selectIdx) {
  const list = curCat === 'All' ? allPresets : allPresets.filter(p => p.c === curCat);
  psel.innerHTML = list.map(p => `<option value="${p.i}">[${p.i}] ${p.n} (${p.c})</option>`).join('');
  if (selectIdx !== undefined) psel.value = selectIdx;
}

function loadPreset(idx) {
  fetch('/preset?i=' + idx).then(r => r.json()).then(s => {
    setGroup('w1', s.o1w); setGroup('w2', s.o2w);
    setVal('o1l', s.o1l); setVal('o2l', s.o2l);
    setVal('o1pw', s.o1pw); setVal('o2pw', s.o2pw);
    setVal('o2s', s.o2s); setVal('o2c', s.o2c);
    setVal('o1pn', s.o1pn); setVal('o2pn', s.o2pn);
    setVal('cut', s.cut); setVal('res', s.res);
    setVal('fenv', s.fenv); setVal('fatk', s.fatk);
    setVal('fdec', s.fdec); setVal('fsus', s.fsus); setVal('frel', s.frel);
    setVal('wth', s.wth);
    setVal('atk', s.atk); setVal('dec', s.dec);
    setVal('sus', s.sus); setVal('rel', s.rel); setVal('prt', s.prt);
    setGroup('ldst', s.ldst); setGroup('lwf', s.lwf);
    setVal('lrt', s.lrt); setVal('ldep', s.ldep);
    setVal('ch_r', s.ch_r); setVal('ch_d', s.ch_d); setVal('ch_m', s.ch_m);
    setVal('dl_t', s.dl_t); setVal('dl_fb', s.dl_fb); setVal('dl_m', s.dl_m);
    setVal('rv_r', s.rv_r); setVal('rv_d', s.rv_d); setVal('rv_m', s.rv_m);
    setVal('vol', s.vol);
  });
}

fetch('/presets').then(r => r.json()).then(list => {
  allPresets = list;
  const cats = ['All', ...new Set(list.map(p => p.c))];
  catsEl.innerHTML = cats.map(c => `<button data-c="${c}" class="${c==='All'?'active':''}">${c}</button>`).join('');
  catsEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      catsEl.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      curCat = b.dataset.c;
      renderPresets();
    });
  });
  renderPresets(0);
});

psel.addEventListener('change', () => loadPreset(+psel.value));
document.getElementById('pprev').addEventListener('click', () => {
  if (psel.selectedIndex > 0) { psel.selectedIndex--; loadPreset(+psel.value); }
});
document.getElementById('pnext').addEventListener('click', () => {
  if (psel.selectedIndex < psel.options.length - 1) { psel.selectedIndex++; loadPreset(+psel.value); }
});

// 2-octave keyboard (25 keys)
let oct = 4;
const keysEl = document.getElementById('keys');
const isB = [0,1,0,1,0,0,1,0,1,0,1,0];
const whites = [];
for (let i = 0; i < 25; i++) if (!isB[i % 12]) whites.push(i);
const ww = 100 / whites.length;

let wi = 0;
for (let i = 0; i < 25; i++) {
  const k = document.createElement('div');
  k.dataset.off = i;
  if (!isB[i % 12]) {
    k.className = 'key w';
    k.style.left = (wi * ww) + '%';
    k.style.width = ww + '%';
    wi++;
  } else {
    k.className = 'key b';
    k.style.left = ((wi - 0.32) * ww) + '%';
    k.style.width = (ww * 0.64) + '%';
  }
  keysEl.appendChild(k);
}

let activeKey = null;
function noteOn(el) {
  if (activeKey === el) return;
  if (activeKey) noteOff(activeKey);
  activeKey = el;
  el.classList.add('down');
  const n = oct * 12 + 12 + (+el.dataset.off);
  cmd(`k=on&v=${n}`);
}
function noteOff(el) {
  if (!el) return;
  el.classList.remove('down');
  const n = oct * 12 + 12 + (+el.dataset.off);
  cmd(`k=off&v=${n}`);
  if (activeKey === el) activeKey = null;
}

keysEl.addEventListener('pointerdown', e => {
  const k = e.target.closest('.key');
  if (k) { e.preventDefault(); keysEl.setPointerCapture(e.pointerId); noteOn(k); }
});
keysEl.addEventListener('pointermove', e => {
  if (!activeKey) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const k = el && el.closest('.key');
  if (k && k !== activeKey) noteOn(k);
});
keysEl.addEventListener('pointerup', () => noteOff(activeKey));
keysEl.addEventListener('pointercancel', () => noteOff(activeKey));

document.getElementById('octdown').onclick = () => {
  if (oct > 1) { oct--; document.getElementById('octval').textContent = `octave ${oct} · keys Z..M / Q..I`; }
};
document.getElementById('octup').onclick = () => {
  if (oct < 6) { oct++; document.getElementById('octval').textContent = `octave ${oct} · keys Z..M / Q..I`; }
};

const keyMap = {KeyZ:0,KeyS:1,KeyX:2,KeyD:3,KeyC:4,KeyV:5,KeyG:6,KeyB:7,KeyH:8,KeyN:9,KeyJ:10,KeyM:11,Comma:12,
                KeyQ:12,Digit2:13,KeyW:14,Digit3:15,KeyE:16,KeyR:17,Digit5:18,KeyT:19,Digit6:20,KeyY:21,Digit7:22,KeyU:23,KeyI:24};
const heldCodes = new Set();
window.addEventListener('keydown', e => {
  if (e.repeat || !(e.code in keyMap) || heldCodes.has(e.code)) return;
  heldCodes.add(e.code);
  const off = keyMap[e.code];
  const el = keysEl.querySelector(`[data-off="${off}"]`);
  if (el) el.classList.add('down');
  cmd(`k=on&v=${oct * 12 + 12 + off}`);
});
window.addEventListener('keyup', e => {
  if (!(e.code in keyMap)) return;
  heldCodes.delete(e.code);
  const off = keyMap[e.code];
  const el = keysEl.querySelector(`[data-off="${off}"]`);
  if (el) el.classList.remove('down');
  cmd(`k=off&v=${oct * 12 + 12 + off}`);
});
</script>
</body>
</html>
