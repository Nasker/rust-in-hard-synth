[package]
name = "rinsynth-esp32"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
anyhow = "1"
# Shared audio-tools synth model — params, preset schema,
# mod matrix, factory bank. No DSP, no fs features on target.
rinsynth-model = { path = "../audio-tools/crates/rinsynth-model", default-features = false }
# Portable DSP core (voice/filter/osc/envelope/effects). No serde — safe at
# opt-level 3, unlike the model crate (see profile note below).
rinsynth-dsp = { path = "../audio-tools/crates/rinsynth-dsp" }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.38", features = ["binstart", "native"] }
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"
embedded-svc = "0.28"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# Xtensa LLVM-21 backend regression (esp-rs/rust#277): cannot lower
# aggregate constant-pool entries — any serde f32 Deserialize impl hits
# "Cannot select PCREL_WRAPPER" at any opt level > 0. The model crate is
# not in the audio path, so compile it unoptimized until a fixed toolchain
# ships (revisit on esp toolchain >= fixed LLVM-22).
[profile.release.package.rinsynth-model]
opt-level = 0

# mDNS responder (espressif/mdns managed component) — resolves
# rustinsynth.local on both the SoftAP and the joined home LAN (STA).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.*" }
